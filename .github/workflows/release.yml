name: Build and release OBS Companion

on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: obs-companion-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

env:
  OBS_VERSION: '33.0.1'
  QT_VERSION: '6.11.1'

jobs:
  windows-x64:
    name: Windows x64 / OBS ${{ matrix.obs_major }}
    runs-on: windows-2022
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - obs_major: 32
            obs_version: '32.1.2'
          - obs_major: 33
            obs_version: '33.0.1'
    steps:
      - name: Check out companion
        uses: actions/checkout@v6
        with:
          path: companion
          fetch-depth: 0
          persist-credentials: false

      - name: Check out OBS Studio
        uses: actions/checkout@v6
        with:
          repository: obsproject/obs-studio
          ref: ${{ matrix.obs_version }}
          path: obs-studio
          submodules: recursive
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Download official OBS runtime and determine Qt version
        id: runtime
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          OBS_TARGET_VERSION: ${{ matrix.obs_version }}
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force obs-runtime | Out-Null
          gh release download "$env:OBS_TARGET_VERSION" --repo obsproject/obs-studio `
            --pattern "OBS-Studio-$env:OBS_TARGET_VERSION-Windows-x64.zip" --dir obs-runtime
          if ($LASTEXITCODE -ne 0) { throw 'Could not download OBS runtime ZIP' }
          $archive = Get-ChildItem obs-runtime -Filter '*.zip' | Select-Object -First 1
          if (-not $archive) { throw 'Missing OBS runtime ZIP' }
          Expand-Archive -LiteralPath $archive.FullName -DestinationPath obs-runtime/extracted
          $core = Get-ChildItem obs-runtime/extracted -Recurse -Filter Qt6Core.dll -File |
            Where-Object { $_.FullName -match 'bin[\\/]64bit' } | Select-Object -First 1
          if (-not $core) { throw 'Could not find OBS Qt6Core.dll' }
          $qtVersion = [regex]::Match($core.VersionInfo.ProductVersion, '^\d+\.\d+\.\d+').Value
          if (-not $qtVersion) { throw "Cannot determine Qt version from $($core.VersionInfo.ProductVersion)" }
          Write-Host "OBS $env:OBS_TARGET_VERSION runtime uses Qt $qtVersion"
          "qt_version=$qtVersion" >> $env:GITHUB_OUTPUT
          "OBS_QT_CORE_DLL=$($core.FullName)" >> $env:GITHUB_ENV

      - name: Install matching Qt and WebSockets
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ steps.runtime.outputs.qt_version }}
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          modules: qtwebsockets
          aqtsource: git+https://github.com/miurahr/aqtinstall.git
          cache: true

      - name: Resolve plugin version
        id: version
        shell: pwsh
        working-directory: companion
        run: |
          $ErrorActionPreference = 'Stop'
          $version = '0.0.0'
          if ($env:GITHUB_REF_TYPE -eq 'tag') {
            if ($env:GITHUB_REF_NAME -cnotmatch '^v([0-9]+[.][0-9]+[.][0-9]+)$') {
              throw "Expected release tag vMAJOR.MINOR.PATCH, got $env:GITHUB_REF_NAME"
            }
            $version = $Matches[1]
          }
          if (-not $env:QT_ROOT_DIR) { throw 'Qt installer did not expose QT_ROOT_DIR' }
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Configure OBS development libraries
        shell: pwsh
        working-directory: obs-studio
        run: |
          cmake --preset windows-x64 -G 'Visual Studio 17 2022' -A x64 `
            -DENABLE_BROWSER=OFF -DENABLE_VLC=OFF -DENABLE_AJA=OFF `
            -DENABLE_SCRIPTING=OFF -DENABLE_VIRTUALCAM=OFF `
            "-DQt6_DIR=$($env:QT_ROOT_DIR.Replace('\','/'))/lib/cmake/Qt6"
          if ($LASTEXITCODE -ne 0) { throw 'OBS configure failed' }

      - name: Build OBS development libraries
        shell: pwsh
        working-directory: obs-studio
        run: |
          cmake --build build_x64 --target obs-frontend-api --config Release --parallel 4
          if ($LASTEXITCODE -ne 0) { throw 'OBS development library build failed' }

      - name: Build companion
        shell: pwsh
        working-directory: companion
        run: |
          ./scripts/build-obs33.ps1 `
            -ObsMajor ${{ matrix.obs_major }} `
            -ObsRoot '${{ github.workspace }}\obs-studio' `
            -QtRoot '${{ env.QT_ROOT_DIR }}' `
            -GitHubRepository '${{ github.repository }}' `
            -Version '${{ steps.version.outputs.version }}' `
            -SkipLegacyPackage -Clean

      - name: Package distribution and SHA-256
        shell: pwsh
        working-directory: companion
        run: |
          ./scripts/package-release.ps1 `
            -ObsMajor ${{ matrix.obs_major }} `
            -BuildDir 'build-obs${{ matrix.obs_major }}' `
            -QtRoot '${{ env.QT_ROOT_DIR }}' `
            -Version '${{ steps.version.outputs.version }}' `
            -ObsQtCoreDll "$env:OBS_QT_CORE_DLL"

      - name: Inspect compiled DLL dependencies
        shell: pwsh
        working-directory: companion
        run: |
          $plugin = "build-obs${{ matrix.obs_major }}/Release/creatora-obs-companion.dll"
          $qtWs = Join-Path $env:QT_ROOT_DIR 'bin/Qt6WebSockets.dll'
          Write-Host "OBS ${{ matrix.obs_version }} target; Qt ${{ steps.runtime.outputs.qt_version }}"
          # PowerShell on windows-2022 does not automatically have the MSVC
          # developer environment, so dumpbin.exe is not on PATH.
          $vswhere = "${env:ProgramFiles(x86)}\\Microsoft Visual Studio\\Installer\\vswhere.exe"
          if (-not (Test-Path -LiteralPath $vswhere)) { throw "vswhere.exe not found: $vswhere" }
          $vsRoot = (& $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath)
          if ($LASTEXITCODE -ne 0 -or -not $vsRoot) { throw 'Visual Studio C++ toolchain not found' }
          $dumpbin = Get-ChildItem -Path (Join-Path $vsRoot 'VC\\Tools\\MSVC') -Filter dumpbin.exe -File -Recurse |
            Where-Object { $_.FullName -match '[\\/]bin[\\/]Hostx64[\\/]x64[\\/]dumpbin.exe

      - name: Upload build artifacts
        uses: actions/upload-artifact@v6
        with:
          name: creatora-obs-companion-obs${{ matrix.obs_major }}-windows-x64
          path: companion/dist/*
          if-no-files-found: error

  publish:
    name: Publish Windows x64 releases
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: windows-x64
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download both OBS release archives
        uses: actions/download-artifact@v7
        with:
          pattern: creatora-obs-companion-obs*-windows-x64
          merge-multiple: true
          path: dist
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          test "$(find dist -maxdepth 1 -type f | wc -l)" -eq 4
          gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --generate-notes \
            --title "Creatora OBS Companion $GITHUB_REF_NAME"


  # Experimental platform builds. Not included in stable releases until pairing
  # credential storage, OBS loading, and package layout are verified on-device.
  macos:
    name: macOS x86_64 / OBS 33 (experimental)
    runs-on: macos-26-intel
    timeout-minutes: 120
    continue-on-error: true
    steps:
      - name: Checkout companion
        uses: actions/checkout@v6
        with:
          path: companion
          persist-credentials: false
      - name: Checkout OBS Studio
        uses: actions/checkout@v6
        with:
          repository: obsproject/obs-studio
          ref: ${{ env.OBS_VERSION }}
          path: obs-studio
          submodules: recursive
          persist-credentials: false
      - name: Install Qt WebSockets
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: mac
          target: desktop
          arch: clang_64
          modules: qtwebsockets
          cache: true
      - name: Verify macOS SDK
        run: |
          xcodebuild -version
          xcrun --sdk macosx --show-sdk-version
          test "$(xcrun --sdk macosx --show-sdk-version | cut -d. -f1)" -ge 26
      - name: Configure OBS development libraries
        working-directory: obs-studio
        run: |
          cmake --preset macos -DENABLE_BROWSER=OFF -DENABLE_VLC=OFF -DENABLE_AJA=OFF -DENABLE_SCRIPTING=OFF -DENABLE_VIRTUALCAM=OFF "-DQt6_DIR=$QT_ROOT_DIR/lib/cmake/Qt6"
      - name: Build OBS development libraries
        working-directory: obs-studio
        run: cmake --build build_macos --target obs-frontend-api --config Release --parallel 4
      - name: Resolve plugin version
        run: |
          version=0.0.0
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            version="${GITHUB_REF_NAME#v}"
            [[ "$version" =~ ^[0-9]+[.][0-9]+[.][0-9]+$ ]] || exit 1
          fi
          echo "CREATORA_BUILD_VERSION=$version" >> "$GITHUB_ENV"
      - name: Configure companion
        run: |
          cmake -S companion -B companion/build-macos -G Xcode \
            -Dlibobs_DIR="$GITHUB_WORKSPACE/obs-studio/build_macos/libobs" \
            -Dobs-frontend-api_DIR="$GITHUB_WORKSPACE/obs-studio/build_macos/frontend/api" \
            -DCMAKE_MODULE_PATH="$GITHUB_WORKSPACE/obs-studio/cmake/finders" \
            -DCMAKE_PREFIX_PATH="$QT_ROOT_DIR;$GITHUB_WORKSPACE/obs-studio/.deps/obs-deps-2026-10-23-universal" \
            -DCREATORA_GITHUB_REPOSITORY="$GITHUB_REPOSITORY" \
            -DCREATORA_BUILD_VERSION="$CREATORA_BUILD_VERSION"
      - name: Build companion
        run: cmake --build companion/build-macos --config Release --parallel 4
      - name: Archive experimental binaries
        run: |
          mkdir -p companion/dist
          find companion/build-macos -type f \( -name 'creatora-obs-companion.so' -o -name 'creatora-obs-companion.dylib' \) -exec cp {} companion/dist/ \;
          test -n "$(find companion/dist -type f)"
      - name: Upload experimental artifact
        uses: actions/upload-artifact@v6
        with:
          name: creatora-obs-companion-macos-experimental
          path: companion/dist/*
          if-no-files-found: error

