          fi
          echo "CREATORA_BUILD_VERSION=$version" >> "$GITHUB_ENV"
      - name: Configure companion
        run: |
          cmake -S companion -B companion/build-linux -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -Dlibobs_DIR="$GITHUB_WORKSPACE/obs-studio/build_ubuntu/libobs" \
            -Dobs-frontend-api_DIR="$GITHUB_WORKSPACE/obs-studio/build_ubuntu/frontend/api" \
            -DCMAKE_MODULE_PATH="$GITHUB_WORKSPACE/obs-studio/cmake/finders" \
            -DCREATORA_GITHUB_REPOSITORY="$GITHUB_REPOSITORY" \
            -DCREATORA_BUILD_VERSION="$CREATORA_BUILD_VERSION"
      - name: Build companion
        run: cmake --build companion/build-linux --parallel 4
      - name: Archive experimental binary
        run: |
          mkdir -p companion/dist
          find companion/build-linux -name 'creatora-obs-companion.so' -type f -exec cp {} companion/dist/ \;
          test -s companion/dist/creatora-obs-companion.so
      - name: Upload experimental artifact
        uses: actions/upload-artifact@v6
        with:
          name: creatora-obs-companion-linux-experimental
          path: companion/dist/*
          if-no-files-found: error
 } |
            Sort-Object FullName -Descending | Select-Object -First 1 -ExpandProperty FullName
          if (-not $dumpbin) { throw "dumpbin.exe not found in $vsRoot" }
          Write-Host "Using dumpbin: $dumpbin"
          Write-Host "Plugin dependencies:"
          & $dumpbin /dependents $plugin
          if ($LASTEXITCODE -ne 0) { throw 'DLL dependency inspection failed' }
          Write-Host "Qt WebSockets dependencies:"
          & $dumpbin /dependents $qtWs
          if ($LASTEXITCODE -ne 0) { throw 'Qt WebSockets dependency inspection failed' }

      - name: Upload build artifacts
        uses: actions/upload-artifact@v6
        with:
          name: creatora-obs-companion-obs${{ matrix.obs_major }}-windows-x64
          path: companion/dist/*
          if-no-files-found: error

